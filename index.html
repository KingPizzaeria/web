        <section id="menu" className="mx-auto max-w-7xl px-4 py-16 text-white">
          <div className="mb-8">
            <div className="mb-6">
              <p className="text-sm font-black uppercase tracking-[.18em] text-ember">Full Menu</p>
              <h2 className="mt-2 text-4xl font-black tracking-tight sm:text-5xl">Choose your feast</h2>
            </div>
            <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
              {menuData.map(section => <a key={section.id} href={`#${section.id}`} className="shrink-0 rounded-full bg-white px-4 py-2 text-sm font-black text-coal toon-soft hover:bg-saffron">{section.label}</a>)}
            </div>
          </div>
          <div className="space-y-14">
            {menuData.map(section => (
              <section key={section.id} id={section.id} className="scroll-mt-28">
                <div className="mb-5 flex items-center gap-4">
                  <img src={section.image} alt={`${section.label} at King Khans`} className="h-16 w-16 rounded-xl object-cover toon-soft" />
                  <div>
                    <p className="text-sm font-black uppercase tracking-[.18em] text-ember">King Khans</p>
                    <h3 className="text-3xl font-black">{section.label}</h3>
                  </div>
                </div>
                <div className="grid gap-5 md:grid-cols-2 xl:grid-cols-3">
                  {section.items.map(([name, desc, priceLabel, price, imgPath], index) => (
                    <article key={`${section.id}-${name}`} className="menu-card fire-hover overflow-hidden rounded-2xl bg-white text-coal toon-soft">
                      <div className="relative">
                        <img src={imgPath || section.image} alt={name} loading="lazy" className="h-44 w-full object-cover" />
                        <span className="absolute right-3 top-3 bg-saffron text-xs font-black text-coal burst-shape">{priceLabel}</span>
                      </div>
                      <div className="p-5">
                        <h4 className="text-xl font-black">{index + 1}. {name}</h4>
                        <p className="mt-3 min-h-14 text-sm leading-6 text-stone-600">{desc}</p>
                        <button onClick={() => addToCart({ name, priceLabel, price })} className="mt-5 w-full rounded-full bg-ember px-5 py-3 font-black text-white toon-soft hover:bg-saffron hover:text-coal">Add to Cart</button>
                      </div>
                    </article>
                  ))}
                </div>
              </section>
            ))}
          </div>
        </section>
      );
    }

    function Cart({ cart, setCart }) {
      const items = Object.values(cart);
      const total = useMemo(() => items.reduce((sum, item) => sum + item.price * item.qty, 0), [cart]);
      function changeQty(key, delta) {
        setCart(current => {
          const next = { ...current };
          if (!next[key]) return next;
          next[key] = { ...next[key], qty: next[key].qty + delta };
          if (next[key].qty <= 0) delete next[key];
          return next;
        });
      }
      function sendOrder() {
        if (!items.length) {
          alert('Please add items to your cart first.');
          return;
        }
        const lines = items.map(item => `- ${item.qty} x ${item.name} (${item.priceLabel})`);
        const text = encodeURIComponent(`Hello King Khans, I would like to order:\n\n${lines.join('\n')}\n\nTotal: ${money(total)}\n\nName:\nDelivery/Pickup:\nAddress:\nNotes:`);
        window.open(`${WHATSAPP}?text=${text}`, '_blank', 'noopener');
      }
      return (
        <section id="cart" className="bg-black px-4 py-16 text-white">
          <div className="mx-auto grid max-w-7xl gap-8 lg:grid-cols-[1fr_420px]">
            <div>
              <p className="text-sm font-black uppercase tracking-[.18em] text-saffron">Your Order</p>
              <h2 className="mt-2 text-4xl font-black">Cart</h2>
              <p className="mt-3 max-w-2xl text-white/75">Add items from the menu, adjust quantities, then send the full order through WhatsApp.</p>
            </div>
            <div className="rounded-2xl bg-cream p-5 text-coal toon-outline">
              <div className="space-y-3">
                {!items.length && <p className="rounded-xl bg-white p-4 text-sm font-bold text-stone-700 toon-soft">Your cart is empty. Add a few King Khans favorites from the menu.</p>}
                {items.map(item => (
                  <div key={item.key} className="flex items-center justify-between gap-3 rounded-xl bg-white p-3 toon-soft">
                    <div>
                      <p className="font-black">{item.name}</p>
                      <p className="text-sm text-stone-600">{item.priceLabel}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => changeQty(item.key, -1)} className="rounded-full bg-saffron px-3 py-1 font-black toon-soft">-</button>
                      <span className="w-6 text-center font-black">{item.qty}</span>
                      <button onClick={() => changeQty(item.key, 1)} className="rounded-full bg-saffron px-3 py-1 font-black toon-soft">+</button>
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-5 flex items-center justify-between border-t-2 border-coal pt-4 text-xl font-black">
                <span>Total</span>
                <span>{money(total)}</span>
              </div>
              <div className="mt-5 grid gap-3 sm:grid-cols-2">
                <button onClick={() => setCart({})} className="rounded-full bg-white px-5 py-3 font-black text-coal toon-soft">Clear Cart</button>
                <button onClick={sendOrder} className="rounded-full bg-basil px-5 py-3 font-black text-white toon-soft">Send Order via WhatsApp</button>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function AboutGalleryReviews() {
      return (
        <>
          <section className="mx-auto grid max-w-7xl gap-10 px-4 py-16 text-white lg:grid-cols-2 lg:items-center">
            <div>
              <p className="text-sm font-black uppercase tracking-[.18em] text-ember">About Us</p>
              <h2 className="mt-2 text-4xl font-black">Warm ovens, bold flavors, quick service.</h2>
              <p className="mt-4 text-lg leading-8 text-white/75">King Khans brings together pizza, kebabs, shawarma, rice dishes, pasta, burgers, and fresh sides for families, travelers, and late-night cravings in Laos.</p>
              <a href="#contact" className="mt-6 inline-flex rounded-full bg-ember px-6 py-3 font-black text-white toon-soft">Contact Us</a>
            </div>
            <div className="flex justify-center md:justify-end">
              <img src="KKlogo.svg" alt="King Khans logo" className="h-72 w-72 rounded-full object-cover toon-outline" />
            </div>
          </section>
          <section className="bg-black px-4 py-16 text-white">
            <div className="mx-auto max-w-7xl">
              <div className="mb-8 flex items-end justify-between gap-4">
                <div>
                  <p className="text-sm font-black uppercase tracking-[.18em] text-ember">Reviews</p>
                  <h2 className="mt-2 text-4xl font-black">Loved by hungry guests</h2>
                </div>
                <a href="#menu" className="hidden rounded-full bg-saffron px-5 py-3 font-black text-coal toon-soft sm:inline-flex">Order Now</a>
              </div>
              <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
                {reviews.map(([quote, name]) => (
                  <figure key={name} className="rounded-2xl bg-cream p-5 text-coal toon-soft">
                    <p className="text-lg text-saffron">★★★★★</p>
                    <blockquote className="mt-3 leading-7 text-stone-700">&quot;{quote}&quot;</blockquote>
                    <figcaption className="mt-4 font-black text-ember">- {name}</figcaption>
                  </figure>
                ))}
              </div>
            </div>
          </section>
          <section className="bg-black px-4 py-16 text-white">
            <div className="mx-auto max-w-7xl">
              <div className="mb-8">
                <p className="text-sm font-black uppercase tracking-[.18em] text-saffron">Photo Gallery</p>
                <h2 className="mt-2 text-4xl font-black">Fresh from the kitchen</h2>
              </div>
              <div className="grid grid-cols-2 gap-3 md:grid-cols-4">
                {galleryImages.map((src, index) => <img key={src} src={src} alt={`King Khans gallery food photo ${index + 1}`} loading="lazy" className="h-44 w-full rounded-2xl object-cover toon-soft md:h-56" />)}
              </div>
            </div>
          </section>
        </>
      );
    }

    function ReservationContact() {
      return (
        <>
          <section id="reservation" className="mx-auto max-w-7xl px-4 py-16 text-white">
            <div className="mb-8">
              <p className="text-sm font-black uppercase tracking-[.18em] text-ember">Entertainment</p>
              <h2 className="mt-2 text-4xl font-black">Weekly Events</h2>
            </div>
            <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-4">
              <div className="rounded-2xl bg-white p-6 text-coal toon-soft">
                <div className="mb-3 text-2xl">🎯</div>
                <h3 className="text-xl font-black">Monday Bingo</h3>
                <p className="mt-2 text-sm text-stone-600">Join us for exciting bingo night with prizes! 7 PM - 10 PM</p>
              </div>
              <div className="rounded-2xl bg-white p-6 text-coal toon-soft">
                <div className="mb-3 text-2xl">🧠</div>
                <h3 className="text-xl font-black">Wednesday Quiz</h3>
                <p className="mt-2 text-sm text-stone-600">Test your knowledge and win amazing rewards! 7:30 PM - 9 PM</p>
              </div>
              <div className="rounded-2xl bg-white p-6 text-coal toon-soft">
                <div className="mb-3 text-2xl">🎤</div>
                <h3 className="text-xl font-black">Friday Karaoke</h3>
                <p className="mt-2 text-sm text-stone-600">Sing your heart out with friends and family! 8 PM - 11 PM</p>
              </div>
              <div className="rounded-2xl bg-white p-6 text-coal toon-soft">
                <div className="mb-3 text-2xl">✨</div>
                <h3 className="text-xl font-black">Weekend Specials</h3>
                <p className="mt-2 text-sm text-stone-600">Enjoy exclusive discounts and special menu items all weekend!</p>
              </div>
            </div>
          </section>
          <section id="contact" className="mx-auto grid max-w-7xl gap-8 px-4 py-16 text-white lg:grid-cols-2">
            <div>
              <p className="text-sm font-black uppercase tracking-[.18em] text-ember">Contact</p>
              <h2 className="mt-2 text-4xl font-black">Order, visit, or follow up</h2>
              <div className="mt-6 space-y-3 text-lg text-white/75">
                <p><strong>WhatsApp:</strong> +856 20 9597 6027</p>
                <p><strong>Email:</strong> <a className="font-black text-amber-100 hover:text-saffron" href="mailto:KingPizzaeriaRestaurant@proton.me">KingPizzaeriaRestaurant@proton.me</a></p>
                <p><strong>Foodpanda:</strong> <a className="font-black text-ember" href={FOODPANDA} target="_blank" rel="noopener">King Pizzaeria Restaurant</a></p>
                <p><strong>Menu:</strong> Pizza, kebabs, shawarma, pasta, rice, burgers, garlic bread, and sides.</p>
              </div>
              <form className="mt-8 flex flex-col gap-3 sm:flex-row" action="https://formspree.io/f/xldryydk" method="POST">
                <label className="sr-only" htmlFor="newsletterEmail">Email address</label>
                <input id="newsletterEmail" type="email" name="email" required placeholder="Email for offers" className="min-h-12 flex-1 rounded-full border-2 border-coal bg-white px-5 text-coal" />
                <button className="rounded-full bg-saffron px-6 py-3 font-black text-coal toon-soft">Newsletter Signup</button>
              </form>
            </div>
            <div className="min-h-[360px] rounded-2xl bg-white p-3 toon-soft">
              <iframe title="King Khans Google Maps location" className="h-full min-h-[336px] w-full rounded-xl" loading="lazy" src="https://www.google.com/maps?q=17.9823056,102.6114722&output=embed"></iframe>
            </div>
          </section>
        </>
      );
    }

    function Footer() {
      return (
        <>
          <footer className="bg-coal px-4 py-10 text-white">
            <div className="mx-auto flex max-w-7xl flex-col gap-5 md:flex-row md:items-center md:justify-between">
              <div className="flex items-center gap-3">
                <img src="KKlogo.svg" alt="King Khans logo" className="h-12 w-12 rounded-full object-cover" />
                <div>
                  <p className="text-xl font-black">King Khans</p>
                  <p className="text-sm text-white/65">King Pizzaeria Restaurant</p>
                </div>
              </div>
              <div className="flex flex-wrap gap-3">
                <a href="#menu" className="font-bold text-amber-100">View Menu</a>
                <a href={FOODPANDA} target="_blank" rel="noopener" className="font-bold text-amber-100">Foodpanda</a>
                <a href={WHATSAPP} target="_blank" rel="noopener" className="font-bold text-amber-100">WhatsApp</a>
              </div>
            </div>
          </footer>
          <a href={WHATSAPP} target="_blank" rel="noopener" className="fixed bottom-5 right-5 z-50 grid h-16 w-16 place-items-center rounded-full bg-[#25D366] text-xl font-black text-white toon-outline" aria-label="Chat on WhatsApp">WA</a>
        </>
      );
    }

    function App() {
      const [cart, setCart] = useState({});
      function addToCart(item) {
        const key = `${item.name}|${item.priceLabel}`;
        setCart(current => ({
          ...current,
          [key]: { ...item, key, qty: (current[key]?.qty || 0) + 1 }
        }));
      }
      return (
        <>
          <a className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[80] focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:shadow" href="#menu">Skip to menu</a>
          <Header />
          <main>
            <Hero />
            <Offers />
            <Menu addToCart={addToCart} />
            <Cart cart={cart} setCart={setCart} />
            <AboutGalleryReviews />
            <ReservationContact />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
