    function Hero() {
      const heroRef = useRef(null);
      const [frame, setFrame] = useState(0);
      useEffect(() => {
        let ticking = false;
        function updateFrame() {
          if (!heroRef.current) return;
          const rect = heroRef.current.getBoundingClientRect();
          const scrollable = rect.height - window.innerHeight;
          const progress = Math.min(1, Math.max(0, -rect.top / Math.max(scrollable, 1)));
          setFrame(Math.round(progress * (sequenceFrames.length - 1)));
          ticking = false;
        }
        function onScroll() {
          if (!ticking) {
            window.requestAnimationFrame(updateFrame);
            ticking = true;
          }
        }
        sequenceFrames.slice(0, 24).forEach(src => {
          const image = new Image();
          image.src = src;
        });
        updateFrame();
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('resize', onScroll);
        };
      }, []);

    function Cart({ cart, setCart }) {
      const items = Object.values(cart);
      const total = useMemo(() => items.reduce((sum, item) => sum + item.price * item.qty, 0), [cart]);
      function changeQty(key, delta) {
        setCart(current => {
          const next = { ...current };
          if (!next[key]) return next;
          next[key] = { ...next[key], qty: next[key].qty + delta };
          if (next[key].qty <= 0) delete next[key];
          return next;
        });
      }
      function sendOrder() {
        if (!items.length) {
          alert('Please add items to your cart first.');
          return;
        }
        const lines = items.map(item => `- ${item.qty} x ${item.name} (${item.priceLabel})`);
        const text = encodeURIComponent(`Hello King Khans, I would like to order:\n\n${lines.join('\n')}\n\nTotal: ${money(total)}\n\nName:\nDelivery/Pickup:\nAddress:\nNotes:`);
        window.open(`${WHATSAPP}?text=${text}`, '_blank', 'noopener');
      }
      return (
        <section id="cart" className="bg-black px-4 py-16 text-white">

            <div>

              <h2 className="mt-2 text-4xl font-black">Cart</h2>
              <p className="mt-3 max-w-2xl text-white/75">Add items from the menu, adjust quantities, then send the full order through WhatsApp.</p>

            <div className="rounded-2xl bg-cream p-5 text-coal toon-outline">
              <div className="space-y-3">
                {!items.length && <p className="rounded-xl bg-white p-4 text-sm font-bold text-stone-700 toon-soft">Your cart is empty. Add a few King Khans favorites from the menu.</p>}
                {items.map(item => (
                  <div key={item.key} className="flex items-center justify-between gap-3 rounded-xl bg-white p-3 toon-soft">
                    <div>
                      <p className="font-black">{item.name}</p>
                      <p className="text-sm text-stone-600">{item.priceLabel}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={() => changeQty(item.key, -1)} className="rounded-full bg-saffron px-3 py-1 font-black toon-soft">-</button>
                      <span className="w-6 text-center font-black">{item.qty}</span>
                      <button onClick={() => changeQty(item.key, 1)} className="rounded-full bg-saffron px-3 py-1 font-black toon-soft">+</button>
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-5 flex items-center justify-between border-t-2 border-coal pt-4 text-xl font-black">
                <span>Total</span>
                <span>{money(total)}</span>
              </div>
              <div className="mt-5 grid gap-3 sm:grid-cols-2">
                <button onClick={() => setCart({})} className="rounded-full bg-white px-5 py-3 font-black text-coal toon-soft">Clear Cart</button>

              </div>
            </div>
          </div>
        </section>
      );

            <div className="grid grid-cols-2 gap-3">

                  <figure key={name} className="rounded-2xl bg-cream p-5 text-coal toon-soft">
                    <p className="text-lg text-saffron">★★★★★</p>
                    <blockquote className="mt-3 leading-7 text-stone-700">&quot;{quote}&quot;</blockquote>

    function ReservationContact() {

                <label className="text-sm font-black">Date<input required type="date" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3" /></label>
                <label className="text-sm font-black">Time<input required type="time" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3" /></label>
                <label className="text-sm font-black">People<input required min="1" defaultValue="2" type="number" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3" /></label>
              </div>
              <div className="grid gap-4 sm:grid-cols-2">
                <label className="text-sm font-black">Name<input required type="text" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3" /></label>
                <label className="text-sm font-black">Phone<input required type="tel" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3" /></label>
              </div>
              <label className="text-sm font-black">Notes<textarea rows="4" className="mt-1 w-full rounded-xl border-2 border-amber-200 px-3 py-3"></textarea></label>

            </form>
          </section>
          <section id="contact" className="mx-auto grid max-w-7xl gap-8 px-4 py-16 text-white lg:grid-cols-2">
            <div>
              <p className="text-sm font-black uppercase tracking-[.18em] text-ember">Contact</p>
              <h2 className="mt-2 text-4xl font-black">Order, visit, or follow up</h2>
              <div className="mt-6 space-y-3 text-lg text-white/75">
                <p><strong>WhatsApp:</strong> +856 20 9597 6027</p>
                <p><strong>Email:</strong> <a className="font-black text-amber-100 hover:text-saffron" href="mailto:KingPizzaeriaRestaurant@proton.me">KingPizzaeriaRestaurant@proton.me</a></p>
                <p><strong>Foodpanda:</strong> <a className="font-black text-ember" href={FOODPANDA} target="_blank" rel="noopener">King Pizzaeria Restaurant</a></p>
                <p><strong>Menu:</strong> Pizza, kebabs, shawarma, pasta, rice, burgers, garlic bread, and sides.</p>
              </div>
              <form className="mt-8 flex flex-col gap-3 sm:flex-row" onSubmit={e => { e.preventDefault(); alert('Thanks for joining the King Khans newsletter.'); }}>
                <label className="sr-only" htmlFor="newsletterEmail">Email address</label>
                <input id="newsletterEmail" type="email" required placeholder="Email for offers" className="min-h-12 flex-1 rounded-full border-2 border-coal bg-white px-5 text-coal" />
                <button className="rounded-full bg-saffron px-6 py-3 font-black text-coal toon-soft">Newsletter Signup</button>
              </form>
            </div>
            <div className="min-h-[360px] rounded-2xl bg-white p-3 toon-soft">
              <iframe title="King Khans Google Maps location" className="h-full min-h-[336px] w-full rounded-xl" loading="lazy" src="https://www.google.com/maps?q=17.9823056,102.6114722&output=embed"></iframe>
            </div>
          </section>
        </>
      );
    }

    function Footer() {
      return (
        <>
          <footer className="bg-coal px-4 py-10 text-white">
            <div className="mx-auto flex max-w-7xl flex-col gap-5 md:flex-row md:items-center md:justify-between">
              <div className="flex items-center gap-3">
                <img src="KKlogo.png" alt="King Khans logo" className="h-12 w-12 rounded-full object-cover" />
                <div>
                  <p className="text-xl font-black">King Khans</p>
                  <p className="text-sm text-white/65">King Pizzaeria Restaurant</p>
                </div>
              </div>
              <div className="flex flex-wrap gap-3">
                <a href="#menu" className="font-bold text-amber-100">View Menu</a>
                <a href={FOODPANDA} target="_blank" rel="noopener" className="font-bold text-amber-100">Foodpanda</a>
                <a href={WHATSAPP} target="_blank" rel="noopener" className="font-bold text-amber-100">WhatsApp</a>
              </div>
            </div>
          </footer>
          <a href={WHATSAPP} target="_blank" rel="noopener" className="fixed bottom-5 right-5 z-50 grid h-16 w-16 place-items-center rounded-full bg-[#25D366] text-xl font-black text-white toon-outline" aria-label="Chat on WhatsApp">WA</a>
        </>
      );
    }

    function App() {
      const [cart, setCart] = useState({});
      function addToCart(item) {
        const key = `${item.name}|${item.priceLabel}`;
        setCart(current => ({
          ...current,
          [key]: { ...item, key, qty: (current[key]?.qty || 0) + 1 }
        }));
      }
      return (
        <>
          <a className="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[80] focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:shadow" href="#menu">Skip to menu</a>
          <Header />
          <main>
            <Hero />
            <Offers />
            <Menu addToCart={addToCart} />
            <Cart cart={cart} setCart={setCart} />
            <AboutGalleryReviews />
            <ReservationContact />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
